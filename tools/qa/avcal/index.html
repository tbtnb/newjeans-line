<html><body style="margin:0;background:#000"><div id=p style="position:fixed;left:0;top:0;width:60px;height:60px;background:#000"></div><script>
window.go=()=>{const c=new AudioContext();const t0=c.currentTime+1;for(let i=0;i<10;i++){const o=c.createOscillator();const g=c.createGain();o.frequency.value=1000;o.connect(g);g.connect(c.destination);g.gain.value=0.8;o.start(t0+i*1.5);o.stop(t0+i*1.5+0.05);}
const p=document.getElementById('p');function f(){const ts=c.getOutputTimestamp();const lat=0;const heard=ts.contextTime+(performance.now()-ts.performanceTime)/1000;let on=false;for(let i=0;i<10;i++){const d=heard-(t0+i*1.5);if(d>=0&&d<0.25)on=true;}p.style.background=on?'#fff':'#000';requestAnimationFrame(f);}f();window.info={base:c.baseLatency,out:c.outputLatency};}
</script></body></html>
