<!doctype html>
<html lang="zh-CN" translate="no">
<head>

<meta charset="UTF-8"/>

<title>跳舞的线 · NewJeans</title>
<link rel="icon" type="image/svg+xml" href="./icon.svg"/>

</head>
<body>
<div id="sky"></div>
<canvas id="scene" aria-label="游戏画面"></canvas>
<div id="flash"></div>
<div id="app">
  <!-- touch surface for gameplay -->
  <div id="stage" aria-hidden="true"></div>

  <!-- level select -->
  <section id="menu" class="screen">
    <header class="topbar">
      <div class="brand"><span class="brand-line"></span>跳舞的线<span class="brand-sub">NewJeans</span></div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-skins" aria-label="线条皮肤"><svg viewBox="0 0 24 24"><path d="M4 18h6v-6h6V6h4"/><rect x="17.5" y="3.5" width="5" height="5" rx="1" fill="currentColor" stroke="none"/></svg></button>
        <button class="icon-btn" id="btn-library" aria-label="曲库"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg></button>
        <button class="icon-btn" id="btn-settings" aria-label="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M5.5 18.5l2.1-2.1M16.4 7.6l2.1-2.1"/></svg></button>
      </div>
    </header>
    <div class="level-card" id="level-card">
      <div class="level-index" id="lv-index">01 / 16</div>
      <h1 class="level-title" id="lv-title">Attention</h1>
      <div class="level-album" id="lv-album">New Jeans</div>
      <div class="level-progress">
        <div class="bar"><i id="lv-bar"></i></div>
        <div class="level-stats"><span id="lv-pct">0%</span><span class="gem-count"><svg viewBox="0 0 24 24" class="gem"><path d="M12 2l6 10-6 10-6-10z"/></svg><b id="lv-gems">0</b>/10</span><span class="crowns" id="lv-crowns"></span></div>
      </div>
    </div>
    <button class="nav-arrow left" id="btn-prev" aria-label="上一首"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>
    <button class="nav-arrow right" id="btn-next" aria-label="下一首"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg></button>
    <div class="start-hint" id="start-hint"><span class="finger"></span><span id="start-label">轻点开始</span></div>
  </section>

  <!-- in-game HUD -->
  <section id="hud" class="screen">
    <button class="hex-btn small" id="btn-pause" aria-label="暂停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
    <div class="hud-progress"><div class="bar"><i id="hud-bar"></i></div><span id="hud-pct">0%</span></div>
    <div class="hud-right"><span class="gem-count"><svg viewBox="0 0 24 24" class="gem"><path d="M12 2l6 10-6 10-6-10z"/></svg><b id="hud-gems">0</b></span><span class="crowns mini" id="hud-crowns"></span></div>
    <div class="ready-hint" id="ready-hint"><span class="finger"></span><span id="ready-label">轻点开始</span></div>
  </section>

  <!-- pause -->
  <section id="pause" class="screen overlay">
    <div class="panel">
      <div class="panel-kicker">已暂停</div>
      <h2 id="pause-title">Ditto</h2>
      <div class="big-pct" id="pause-pct">0%</div>
      <div class="btn-row">
        <button class="hex-btn" id="btn-home-p" aria-label="返回选关"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>
        <button class="hex-btn big" id="btn-resume" aria-label="继续"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>
        <button class="hex-btn" id="btn-restart-p" aria-label="重新开始"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2-5M5 4v4h4"/></svg></button>
      </div>
      <div class="btn-labels"><span>选关</span><span>继续</span><span>重来</span></div>
    </div>
  </section>

  <!-- fail -->
  <section id="fail" class="screen overlay">
    <div class="panel">
      <h2 id="fail-title">Ditto</h2>
      <div class="big-pct" id="fail-pct">0%</div>
      <div class="result-bar"><div class="bar"><i id="fail-bar"></i></div><div class="bar-marks" id="fail-marks"></div></div>
      <div class="result-line"><span class="gem-count"><svg viewBox="0 0 24 24" class="gem"><path d="M12 2l6 10-6 10-6-10z"/></svg><b id="fail-gems">0</b>/10</span></div>
      <button class="pill-btn" id="btn-checkpoint" hidden><span class="crown-ico"></span>从皇冠处继续<small>该皇冠不计入</small></button>
      <div class="btn-row">
        <button class="hex-btn" id="btn-home-f" aria-label="返回选关"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>
        <button class="hex-btn big" id="btn-retry" aria-label="重试"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2-5M5 4v4h4"/></svg></button>
        <button class="hex-btn" id="btn-settings-f" aria-label="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></button>
      </div>
    </div>
  </section>

  <!-- clear -->
  <section id="clear" class="screen overlay">
    <div class="panel">
      <h2 id="clear-title">Ditto</h2>
      <div class="clear-gems"><svg viewBox="0 0 24 24" class="gem"><path d="M12 2l6 10-6 10-6-10z"/></svg><b id="clear-gems">0</b>/10</div>
      <div class="crown-row" id="clear-crowns"></div>
      <div class="result-bar"><div class="bar"><i id="clear-bar" style="width:100%"></i></div><span class="pct-tag">100%</span></div>
      <div class="clear-stats" id="clear-stats"></div>
      <div class="btn-row">
        <button class="hex-btn" id="btn-home-c" aria-label="返回选关"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>
        <button class="hex-btn big" id="btn-replay" aria-label="再玩一次"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>
        <button class="hex-btn" id="btn-next-c" aria-label="下一首"><svg viewBox="0 0 24 24"><path d="M6 5l8 7-8 7M17 5v14"/></svg></button>
      </div>
    </div>
  </section>

  <!-- library -->
  <section id="library" class="screen sheet">
    <div class="sheet-head"><h2>曲库</h2><button class="icon-btn" id="btn-close-lib" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ol class="song-list" id="song-list"></ol>
  </section>

  <!-- settings -->
  <section id="settings" class="screen sheet">
    <div class="sheet-head"><h2>设置</h2><button class="icon-btn" id="btn-close-set" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="set-list">
      <label class="set-row"><span>音量</span><input type="range" id="set-volume" min="0" max="1" step="0.05"/></label>
      <label class="set-row"><span>音画延迟 <small id="set-offset-val">0 ms</small></span><input type="range" id="set-offset" min="-300" max="300" step="5"/></label>
      <div class="set-row"><span>延迟校准<small>跟着节拍轻点 10 次；耳机/蓝牙延迟大时请先校准</small></span><button class="pill-btn small" id="btn-calibrate">开始</button></div>
      <div class="set-row"><span>画质</span><div class="seg" id="set-quality"><button data-v="high">高</button><button data-v="low">流畅</button></div></div>
      <div class="set-row"><span>线条皮肤<small id="set-skin-name">经典</small></span><button class="pill-btn small" id="btn-open-skins">更换</button></div>
      <label class="set-row"><span>震动反馈<small>仅支持的设备</small></span><input type="checkbox" id="set-vibration"/></label>
      <div class="set-row"><span>存档</span><div class="row-btns"><button class="pill-btn small" id="btn-export">导出</button><label class="pill-btn small">导入<input type="file" id="file-import" accept="application/json,.json" hidden/></label></div></div>
      <p class="set-note" id="set-note">进度保存在本浏览器中。</p>
    </div>
  </section>

  <!-- line skins -->
  <section id="skins" class="screen sheet">
    <div class="sheet-head"><h2>线条皮肤</h2><button class="icon-btn" id="btn-close-skins" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="skin-body">
      <div class="skin-preview"><canvas id="skin-canvas" aria-label="皮肤预览"></canvas><div class="skin-info"><b id="skin-name">经典</b><span id="skin-desc"></span></div></div>
      <ul class="skin-grid" id="skin-grid"></ul>
    </div>
  </section>

  <!-- calibration -->
  <section id="calib" class="screen overlay">
    <div class="panel"><div class="panel-kicker">延迟校准</div><div class="calib-dot" id="calib-dot"></div><p id="calib-msg">听到节拍时轻点屏幕</p><button class="pill-btn small" id="btn-calib-cancel">取消</button></div>
  </section>

  <div id="loading" class="screen"><div class="loader"><i></i></div><span id="loading-msg">载入中</span></div>
  <div id="toast" role="status"></div>
</div>
